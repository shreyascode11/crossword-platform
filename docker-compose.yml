services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: crossword
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18+ stores data in a version subdir; mount the parent dir.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crossword"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Port intentionally NOT published — internal to the compose network only,
    # so it never clashes with a Postgres already running on the host's :5432.

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: crossword
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      # Set these in .env when deploying to a real host.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE: ${DJANGO_SECURE:-False}
      AUTH_TOKEN_TTL_HOURS: ${AUTH_TOKEN_TTL_HOURS:-12}
      # Key pool — requests rotate across these and fail over when one is
      # rate-limited or out of quota. Extra slots are optional.
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_API_KEY_2: ${GROQ_API_KEY_2:-}
      GROQ_API_KEY_3: ${GROQ_API_KEY_3:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at BUILD time — must be the URL the
        # student's browser can reach, not an internal container name.
        # Rebuild the frontend image after changing this.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
